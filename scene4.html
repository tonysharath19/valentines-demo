<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Order Summary</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & CORE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Soft Romantic Gradient Background */
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E6 50%, #FCE7F3 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #374151;
        }

        /* --- HEADER --- */
        /* --- UPDATED HEADER --- */
        .header {
            /* Changed from transparent white to Romantic Pink */
            background: #BE185D; 
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(190, 24, 93, 0.3); /* Pink shadow */
            z-index: 10;
        }

        .header-title { 
            color: white; /* Changed from Pink to White */
            font-weight: 700; 
            font-size: 25px; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* Floating Hearts Background Animation */
        .bg-heart {
            position: absolute;
            color: rgba(244, 114, 182, 0.1); /* Very faint pink */
            font-size: 24px;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        .h1 { top: 10%; left: 10%; animation-delay: 0s; font-size: 40px; }
        .h2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 30px; }
        .h3 { bottom: 15%; left: 20%; animation-delay: 2s; font-size: 50px; }
        .h4 { bottom: 30%; right: 10%; animation-delay: 3s; font-size: 35px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* --- THE INVOICE CARD --- */
        .invoice-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 
                0 20px 40px -5px rgba(244, 114, 182, 0.15), 
                0 10px 20px -5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 5;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Card Header */
        .card-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #FBCFE8;
        }
        .icon-wrapper {
            width: 60px; height: 60px;
            background: #FDF2F8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.1);
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #831843;
            margin-bottom: 5px;
        }
        .card-subtitle {
            font-size: 13px;
            color: #9CA3AF;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Details List */
        .details-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            /* --- ADD THESE TWO LINES --- */
            align-items: center;  /* Centers the flex items horizontally */
            text-align: center;   /* Ensures multi-line text is centered */
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9CA3AF; /* Grey tech look */
            font-weight: 600;
        }

        .value {
            font-family: 'Dancing Script', cursive; /* Handwritten look */
            font-size: 22px;
            color: #DB2777; /* Pink */
            line-height: 1.2;
        }

        /* Specific tweak for the long "Sender" text */
        .value.long {
            font-size: 20px;
        }

        /* --- CTA BUTTON --- */
        .footer {
            padding: 24px;
            padding-bottom: max(34px, env(safe-area-inset-bottom));
            z-index: 10;
        }

        .btn-continue {
            width: 100%;
            background: #BE185D; /* Romantic Red-Pink */
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px -5px rgba(190, 24, 93, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-continue:active {
            transform: scale(0.98);
        }

        /* Simple reveal animation for button */
        .btn-reveal {
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">Shipment Receipt</div>
    </header>

    <div class="main-content">
        <div class="bg-heart h1">❤</div>
        <div class="bg-heart h2">❤</div>
        <div class="bg-heart h3">❤</div>
        <div class="bg-heart h4">❤</div>

        <div class="invoice-card">
            <div class="card-header">
                <div class="icon-wrapper">🎁</div>
                <h1 class="card-title">Package Details</h1>
                <div class="card-subtitle">ID: #LOVE-2026</div>
            </div>

            <div class="details-list">
                <div class="detail-item">
                    <span class="label">Package Content</span>
                    <span class="value">Handle With Care</span>
                </div>

                <div class="detail-item">
                    <span class="label">Total Weight</span>
                    <span class="value">Emotionally Heavy</span>
                </div>

                <div class="detail-item">
                    <span class="label">Sender</span>
                    <span class="value long">Someone Who Thinks About You</span>
                </div>

                <div class="detail-item">
                    <span class="label">Delivery Note</span>
                    <span class="value" style="color: #9D174D;">Fragile. Please Don't Return.</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn-continue btn-reveal" onclick="goToCarousel()">
            Continue ➔
        </button>
    </div>

    <script>
        function goToCarousel() {
            // Transitions to Scene 5 (The Carousel)
            window.location.href = "scene5.html";
        }
    </script>
</body>
</html>
